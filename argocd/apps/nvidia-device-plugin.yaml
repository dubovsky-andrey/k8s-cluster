apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-gpu-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://nvidia.github.io/gpu-operator
    chart: gpu-operator
    targetRevision: v24.9.0
    helm:
      values: |
        driver:
          enabled: false
        devicePlugin:
          enabled: true
        toolkit:
          enabled: false
        node-feature-discovery:
          enabled: true
          worker:
            tolerations:
              - operator: Exists
        operator:
          defaultRuntime: containerd
          env:
            - name: VALIDATOR_IMAGE
              value: nvcr.io/nvidia/cloud-native/gpu-operator-validator:v24.9.0
        validator:
          enabled: false
        dcgm:
          enabled: false
        dcgmExporter:
          enabled: false
        tolerations:
          - operator: Exists
  destination:
    server: https://kubernetes.default.svc
    namespace: nvidia
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
