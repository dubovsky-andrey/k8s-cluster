apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-device-plugin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://nvidia.github.io/k8s-device-plugin
    chart: nvidia-device-plugin
    targetRevision: "0.17.3"
    helm:
      values: |
        gfd:
          enabled: true
          tolerations:
            - operator: Exists
          nodeSelector:
            kubernetes.io/arch: amd64
        tolerations:
          - operator: Exists
        config:
          create: true
          map:
            config.yaml: |
              version: v1
              flags:
                deviceDiscoveryStrategy: nvml
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
