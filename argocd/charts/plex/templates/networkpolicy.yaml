apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: plex-egress-with-dns
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: plex
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              k8s-app: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
